name: YahooNewsCommentHider

options:
  bundleIdPrefix: com.deafumi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: 20
    DEVELOPMENT_TEAM: P75Y8BDKAN
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES

# 共通ファイルグループ。各ターゲットから参照する。
fileGroups:
  - README.md
  - PRIVACY.md
  - APPSTORE.md
  - SUPPORT.md

targets:

  # ========== iOS / iPadOS アプリ ==========
  YahooNewsCommentHider-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes:
          - "Info-macOS.plist"
          - "Info.plist"
    info:
      path: Generated/App-iOS-Info.plist
      properties:
        CFBundleDisplayName: Y News きえるくん
        CFBundleName: Y News きえるくん
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHumanReadableCopyright: © 2026
    settings:
      base:
        PRODUCT_NAME: Y News きえるくん
        PRODUCT_MODULE_NAME: NewsKieruKun
        EXECUTABLE_NAME: NewsKieruKun
        PRODUCT_BUNDLE_IDENTIFIER: com.deafumi.NewsYKieruKun
        DEVELOPMENT_TEAM: P75Y8BDKAN
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: YahooNewsCommentHiderExtension-iOS
      - target: YahooNewsContentBlocker-iOS

  YahooNewsCommentHiderExtension-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Extension
        excludes:
          - "Info.plist"
          - "Resources/_locales"
          - "Resources/images"
      # _locales / images は階層構造を保持するためフォルダ参照(青フォルダ)として登録する。
      # こうしないと Xcode が _locales/ja/messages.json と _locales/en/messages.json を
      # 同名でフラット化して衝突する。images もマニフェストが "images/icon-XX.png" を参照するので
      # サブディレクトリ構造を保つ必要がある。
      - path: Extension/Resources/_locales
        type: folder
      - path: Extension/Resources/images
        type: folder
    info:
      path: Generated/Extension-iOS-Info.plist
      properties:
        CFBundleDisplayName: Y News きえるくん
        CFBundleName: Y News きえるくん
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_NAME: NewsKieruKunExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.deafumi.NewsYKieruKun.Extension
        DEVELOPMENT_TEAM: P75Y8BDKAN
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements

  YahooNewsContentBlocker-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ContentBlocker
    info:
      path: Generated/ContentBlocker-iOS-Info.plist
      properties:
        CFBundleDisplayName: Y News きえるくん
        CFBundleName: Y News きえるくん
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        NSHumanReadableDescription: Hides supported news page elements with lightweight content blocking rules.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_NAME: YNewsKieruKunContentBlocker
        PRODUCT_MODULE_NAME: YNewsKieruKunContentBlocker
        PRODUCT_BUNDLE_IDENTIFIER: com.deafumi.NewsYKieruKun.ContentBlocker
        DEVELOPMENT_TEAM: P75Y8BDKAN
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ContentBlocker/ContentBlocker.entitlements

  # ========== macOS アプリ ==========
  YahooNewsCommentHider-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Info-macOS.plist"
    info:
      path: Generated/App-macOS-Info.plist
      properties:
        CFBundleDisplayName: Y News きえるくん
        CFBundleName: Y News きえるくん
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSHasLocalizedDisplayName: true
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026
    settings:
      base:
        PRODUCT_NAME: Y News きえるくん
        PRODUCT_MODULE_NAME: NewsKieruKun
        EXECUTABLE_NAME: NewsKieruKun
        PRODUCT_BUNDLE_IDENTIFIER: com.deafumi.NewsYKieruKun
        DEVELOPMENT_TEAM: P75Y8BDKAN
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: YahooNewsCommentHiderExtension-macOS
        embed: true
        copy:
          destination: plugins
      - target: YahooNewsContentBlocker-macOS
        embed: true
        copy:
          destination: plugins

  YahooNewsCommentHiderExtension-macOS:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Extension
        excludes:
          - "Info.plist"
          - "Resources/_locales"
          - "Resources/images"
      # _locales / images は階層構造を保持するためフォルダ参照(青フォルダ)として登録する。
      # こうしないと Xcode が _locales/ja/messages.json と _locales/en/messages.json を
      # 同名でフラット化して衝突する。images もマニフェストが "images/icon-XX.png" を参照するので
      # サブディレクトリ構造を保つ必要がある。
      - path: Extension/Resources/_locales
        type: folder
      - path: Extension/Resources/images
        type: folder
    info:
      path: Generated/Extension-macOS-Info.plist
      properties:
        CFBundleDisplayName: Y News きえるくん
        CFBundleName: Y News きえるくん
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_NAME: NewsKieruKunExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.deafumi.NewsYKieruKun.Extension
        DEVELOPMENT_TEAM: P75Y8BDKAN
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  YahooNewsContentBlocker-macOS:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ContentBlocker
    info:
      path: Generated/ContentBlocker-macOS-Info.plist
      properties:
        CFBundleDisplayName: Y News きえるくん
        CFBundleName: Y News きえるくん
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        NSHumanReadableDescription: Hides supported news page elements with lightweight content blocking rules.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_NAME: YNewsKieruKunContentBlocker
        PRODUCT_MODULE_NAME: YNewsKieruKunContentBlocker
        PRODUCT_BUNDLE_IDENTIFIER: com.deafumi.NewsYKieruKun.ContentBlocker
        DEVELOPMENT_TEAM: P75Y8BDKAN
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ContentBlocker/ContentBlocker.entitlements
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  YahooNewsCommentHider (iOS):
    build:
      targets:
        YahooNewsCommentHider-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  YahooNewsCommentHider (macOS):
    build:
      targets:
        YahooNewsCommentHider-macOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
